<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#"><!-- fix favicon.ico -->
    <title>3D IRPC Shift Schedule</title>

    <!-- import map: ให้ import 'three' / 'three/addons/...' / 'lil-gui' ใช้ได้ -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.128.0/es2022/three.mjs",
            "three/addons/": "https://esm.sh/three@0.128.0/es2022/examples/jsm/",
            "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
        }
    }
    </script>

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div id="info">📅 วันที่ปัจจุบัน สีทอง | M:เช้า(เหลือง), E:บ่าย(ส้ม), N:ดึก(น้ำเงิน), O:หยุด(เทา)</div>
    <div id="month-badge">—</div>

    <!-- Active day focus (ล่างสุด) -->
    <div id="focus-badge" aria-live="polite">
        <span class="focus-label">FOCUS</span>
        <span class="focus-month" id="focus-month">JAN</span>
        <span class="focus-day" id="focus-day">1</span>
    </div>

    <div id="jump-controls">
        <span class="jump-icon">🚀</span>
        <div class="month-picker">
            <label for="jump-month" class="sr-only">เลือกเดือน</label>
            <select id="jump-month" title="เลือกเดือน" aria-label="เลือกเดือน"></select>
            <label for="jump-year" class="sr-only">เลือกปี</label>
            <input type="number" id="jump-year" value="2026" min="2020" max="2030" step="1" title="เลือกปี" aria-label="เลือกปี" placeholder="ปี">
        </div>
        <label for="jump-day">วันที่:</label>
        <input type="number" id="jump-day" min="1" max="31" value="12" title="เลือกวันที่" aria-label="เลือกวันที่">
        <button id="jump-btn">JUMP</button>
        <button id="home-btn">HOME</button>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
